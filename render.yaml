services:
  - type: web
    name: beryl-koko-portfolio
    runtime: static
    buildCommand: npm ci && npm run check && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
